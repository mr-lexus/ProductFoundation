name: CI

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
        env:
          POSTGRES_DB: foundation_test
          POSTGRES_PASSWORD: foundation_test
          POSTGRES_USER: foundation_test
        options: >-
          --health-cmd "pg_isready -U foundation_test -d foundation_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
        ports:
          - 5432:5432
    env:
      TEST_DATABASE_URL: postgresql://foundation_test:foundation_test@127.0.0.1:5432/foundation_test
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:ci
      - run: pnpm build
      - run: pnpm smoke:api
      - run: pnpm smoke:compose

  platform-shells:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      CI: true
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:native-security
      - run: pnpm --filter @app/mobile check
      - run: pnpm --filter @app/mobile build
      - run: pnpm --filter @app/desktop build:ci

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
